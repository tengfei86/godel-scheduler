# ================================================================
# Prometheus config for Group A — Shared Binder (Baseline)
#
# Scrape targets:
#   • eno-scheduler  (eno-system, port 10251)
#   • eno-dispatcher (eno-system, port 10351)
#   • eno-binder     (eno-system, port 10451, standalone)
# ================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - "/etc/prometheus/rules.yml"

    scrape_configs:
      # ── Gödel Scheduler ──
      - job_name: "eno-scheduler"
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: ["eno-system"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: eno-scheduler-metrics
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: metrics
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_service_name]
            target_label: service

      # ── Gödel Dispatcher ──
      - job_name: "eno-dispatcher"
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: ["eno-system"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: eno-dispatcher-metrics
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: metrics
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      # ── Standalone Binder (shared by all Schedulers) ──
      - job_name: "eno-binder"
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: ["eno-system"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: eno-binder-metrics
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: metrics
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

  # ================================================================
  # Recording rules for Group A
  # ================================================================
  rules.yml: |
    groups:
      # ──────────────────────────────────────────────────
      #  Scheduler pipeline — throughput & latency
      # ──────────────────────────────────────────────────
      - name: scheduler_pipeline
        interval: 15s
        rules:
          # Scheduling throughput (pods/s) by result
          - record: eno:scheduler_pod_scheduling_attempts:rate1m
            expr: rate(scheduler_pod_scheduling_attempts[1m])

          - record: eno:scheduler_pod_scheduling_attempts:rate5m
            expr: rate(scheduler_pod_scheduling_attempts[5m])

          # ----- E2E scheduling latency -----
          - record: eno:scheduler_e2e_scheduling_duration:p50
            expr: histogram_quantile(0.50, rate(scheduler_e2e_scheduling_duration_seconds_bucket[5m]))

          - record: eno:scheduler_e2e_scheduling_duration:p90
            expr: histogram_quantile(0.90, rate(scheduler_e2e_scheduling_duration_seconds_bucket[5m]))

          - record: eno:scheduler_e2e_scheduling_duration:p99
            expr: histogram_quantile(0.99, rate(scheduler_e2e_scheduling_duration_seconds_bucket[5m]))

          - record: eno:scheduler_e2e_scheduling_duration:avg
            expr: >
              rate(scheduler_e2e_scheduling_duration_seconds_sum[5m])
              /
              rate(scheduler_e2e_scheduling_duration_seconds_count[5m])

          # ----- Core algorithm latency -----
          - record: eno:scheduler_scheduling_algorithm_duration:p90
            expr: histogram_quantile(0.90, rate(scheduler_scheduling_algorithm_duration_seconds_bucket[5m]))

          - record: eno:scheduler_scheduling_algorithm_duration:p99
            expr: histogram_quantile(0.99, rate(scheduler_scheduling_algorithm_duration_seconds_bucket[5m]))

      # ──────────────────────────────────────────────────
      #  Standalone Binder — throughput & latency
      # ──────────────────────────────────────────────────
      - name: standalone_binder
        interval: 15s
        rules:
          # Binding pod attempts (pods/s) by result
          - record: eno:binder_binding_pod_attempts:rate1m
            expr: rate(binder_binding_pod_attempts[1m])

          - record: eno:binder_binding_pod_attempts:rate5m
            expr: rate(binder_binding_pod_attempts[5m])

          # Binding success rate
          - record: eno:binder_binding_pod_attempts:success_rate5m
            expr: >
              rate(binder_binding_pod_attempts{result="bound"}[5m])
              /
              rate(binder_binding_pod_attempts[5m])

          # ----- Binding phase latency -----
          - record: eno:binder_pod_binding_phase_duration:p50
            expr: histogram_quantile(0.50, rate(binder_pod_binding_phase_duration_seconds_bucket{phase="binding"}[5m]))

          - record: eno:binder_pod_binding_phase_duration:p90
            expr: histogram_quantile(0.90, rate(binder_pod_binding_phase_duration_seconds_bucket{phase="binding"}[5m]))

          - record: eno:binder_pod_binding_phase_duration:p99
            expr: histogram_quantile(0.99, rate(binder_pod_binding_phase_duration_seconds_bucket{phase="binding"}[5m]))

          - record: eno:binder_pod_binding_phase_duration:avg
            expr: >
              rate(binder_pod_binding_phase_duration_seconds_sum{phase="binding"}[5m])
              /
              rate(binder_pod_binding_phase_duration_seconds_count{phase="binding"}[5m])

          # ----- Unit E2E latency -----
          - record: eno:binder_unit_e2e_duration:p90
            expr: histogram_quantile(0.90, rate(binder_unit_e2e_duration_seconds_bucket[5m]))

          - record: eno:binder_unit_e2e_duration:p99
            expr: histogram_quantile(0.99, rate(binder_unit_e2e_duration_seconds_bucket[5m]))

          # Pod rejection / failure counters
          - record: eno:binder_pod_rejection:rate5m
            expr: rate(binder_pod_rejection[5m])

          - record: eno:binder_pod_binding_failure:rate5m
            expr: rate(binder_pod_binding_failure[5m])

      # ──────────────────────────────────────────────────
      #  E2E pipeline (Gödel pod lifecycle)
      # ──────────────────────────────────────────────────
      - name: e2e_pipeline
        interval: 15s
        rules:
          # Eno pod E2E latency (dispatcher → scheduler → binder → done)
          - record: eno:pod_e2e_duration:p50
            expr: histogram_quantile(0.50, rate(eno_pod_e2e_duration_seconds_bucket[5m]))

          - record: eno:pod_e2e_duration:p90
            expr: histogram_quantile(0.90, rate(eno_pod_e2e_duration_seconds_bucket[5m]))

          - record: eno:pod_e2e_duration:p99
            expr: histogram_quantile(0.99, rate(eno_pod_e2e_duration_seconds_bucket[5m]))

          # Combined schedule + bind P90 estimate
          - record: eno:e2e_schedule_and_bind_duration:p90_estimate
            expr: >
              eno:scheduler_e2e_scheduling_duration:p90
              +
              eno:binder_pod_binding_phase_duration:p90

          - record: eno:e2e_schedule_and_bind_duration:p99_estimate
            expr: >
              eno:scheduler_e2e_scheduling_duration:p99
              +
              eno:binder_pod_binding_phase_duration:p99
