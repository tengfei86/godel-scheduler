apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  namespace: eno-system
  labels:
    component: scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eno-scheduler
  template:
    metadata:
      labels:
        app: eno-scheduler
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      serviceAccountName: eno
      tolerations:
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: scheduler
          image: eno-local:latest
          imagePullPolicy: Never
          command: ["/usr/local/bin/scheduler"]
          ports:
            - containerPort: 10251
              name: metrics
              protocol: TCP
          args:
            - "--leader-elect=false"
            - "--tracer=noop"
            - "--v=4"
            - "--disable-preemption=false"
            - "--config=/config/scheduler.config"
            - "--reservation-ttl=60"
            - "--feature-gates=ResourceReservation=true"
          resources:
            limits:
              cpu: "2"
              memory: 4G
            requests:
              cpu: "1"
              memory: 2G
          volumeMounts:
            - mountPath: /config
              name: scheduler-config
      volumes:
        - name: scheduler-config
          configMap:
            name: eno-scheduler-config
            items:
            - key: eno-scheduler-config
              path: scheduler.config
