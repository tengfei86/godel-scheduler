apiVersion: apps/v1
kind: Deployment
metadata:
  name: binder
  namespace: godel-system
  labels:
    component: binder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: binder
  template:
    metadata:
      labels:
        app: binder
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      serviceAccountName: godel
      tolerations:
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: binder
          image: godel-local:latest
          imagePullPolicy: Never
          command: ["/usr/local/bin/binder"]
          ports:
            - containerPort: 10451
              name: metrics
              protocol: TCP
          args:
            - "--leader-elect=false"
            - "--tracer=noop"
            - "--v=5"
            - "--feature-gates=ResourceReservation=true"
            - "--reservation-ttl=60"
          resources:
            limits:
              cpu: "2"
              memory: 4G
            requests:
              cpu: "1"
              memory: 2G
          volumeMounts:
            - mountPath: /config
              name: binder-config
      volumes:
        - name: binder-config
          configMap:
            name: godel-binder-config
            items:
              - key: godel-binder-config
                path: binder.config
