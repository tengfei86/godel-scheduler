apiVersion: apps/v1
kind: Deployment
metadata:
  name: res-dp
  annotations:
    eno.io/reservation: "true"
spec:
  replicas: 3
  selector:
    matchLabels:
      name: res-dp
  template:
    metadata:
      labels:
        name: res-dp
      annotations:
        eno.io/pod-resource-type: guaranteed
        eno.io/pod-launcher: kubelet
    spec:
      terminationGracePeriodSeconds: 0
      schedulerName: eno-scheduler
      containers:
        - name: nginx
          image: nginx:1.14.2
          resources:
            requests:
              cpu: 1
              memory: 500Mi
            limits:
              cpu: 1
              memory: 500Mi
