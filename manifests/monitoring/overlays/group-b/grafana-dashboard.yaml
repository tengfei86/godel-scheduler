---
# Grafana dashboard provisioning — 告知 Grafana 从哪里加载 dashboard JSON
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provisioning
  namespace: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: scheduler-dashboards
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /etc/grafana/dashboards
---
# Grafana dashboard JSON — Group B: Embedded Binder (Proposed)
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  eno-embedded-binder.json: |
    {
      "title": "Group B — Embedded Binder (Proposed)",
      "uid": "eno-embedded-binder",
      "timezone": "browser",
      "refresh": "15s",
      "time": { "from": "now-30m", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Scheduling Throughput (pods/s)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "eno:scheduler_pod_scheduling_attempts:rate1m",
              "legendFormat": "throughput"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "reqps" }
          }
        },
        {
          "id": 2,
          "title": "Embedded Bind Throughput (pods/s)",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "eno:binder_embedded_bind_pods:rate1m",
              "legendFormat": "pod bind throughput"
            },
            {
              "expr": "eno:binder_embedded_bind_units:rate1m",
              "legendFormat": "unit bind throughput"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "reqps" }
          }
        },
        {
          "id": 3,
          "title": "E2E Scheduling Latency",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "eno:scheduler_e2e_scheduling_duration:p50",
              "legendFormat": "P50"
            },
            {
              "expr": "eno:scheduler_e2e_scheduling_duration:p90",
              "legendFormat": "P90"
            },
            {
              "expr": "eno:scheduler_e2e_scheduling_duration:p99",
              "legendFormat": "P99"
            },
            {
              "expr": "eno:scheduler_e2e_scheduling_duration:avg",
              "legendFormat": "avg"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "s" }
          }
        },
        {
          "id": 4,
          "title": "Embedded Bind Latency — Pod Level",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "eno:binder_embedded_bind_pod_duration:p50",
              "legendFormat": "P50"
            },
            {
              "expr": "eno:binder_embedded_bind_pod_duration:p90",
              "legendFormat": "P90"
            },
            {
              "expr": "eno:binder_embedded_bind_pod_duration:p99",
              "legendFormat": "P99"
            },
            {
              "expr": "eno:binder_embedded_bind_pod_duration:avg",
              "legendFormat": "avg"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "s" }
          }
        },
        {
          "id": 5,
          "title": "Embedded Bind Latency — Unit Level",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 16, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "eno:binder_embedded_bind_duration:p50",
              "legendFormat": "P50"
            },
            {
              "expr": "eno:binder_embedded_bind_duration:p90",
              "legendFormat": "P90"
            },
            {
              "expr": "eno:binder_embedded_bind_duration:p99",
              "legendFormat": "P99"
            },
            {
              "expr": "eno:binder_embedded_bind_duration:avg",
              "legendFormat": "avg"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "s" }
          }
        },
        {
          "id": 6,
          "title": "Core Algorithm Latency",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 16, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "eno:scheduler_scheduling_algorithm_duration:p90",
              "legendFormat": "P90"
            },
            {
              "expr": "eno:scheduler_scheduling_algorithm_duration:p99",
              "legendFormat": "P99"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "s" }
          }
        },
        {
          "id": 7,
          "title": "Pod E2E Duration (Dispatcher → Binder)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 24, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "eno:pod_e2e_duration:p50",
              "legendFormat": "P50"
            },
            {
              "expr": "eno:pod_e2e_duration:p90",
              "legendFormat": "P90"
            },
            {
              "expr": "eno:pod_e2e_duration:p99",
              "legendFormat": "P99"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "s" }
          }
        },
        {
          "id": 8,
          "title": "Bind Success Rate",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 24, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "eno:binder_embedded_bind_pods:success_rate1m",
              "legendFormat": "pod success rate"
            },
            {
              "expr": "eno:binder_embedded_bind_units:success_rate1m",
              "legendFormat": "unit success rate"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "percentunit", "min": 0, "max": 1 }
          }
        },
        {
          "id": 9,
          "title": "Retries & Fallback",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 32, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "eno:binder_embedded_bind_retries:rate1m",
              "legendFormat": "retries"
            },
            {
              "expr": "eno:binder_dispatcher_fallback:rate1m",
              "legendFormat": "dispatcher fallback"
            },
            {
              "expr": "eno:binder_node_validation_failures:rate1m",
              "legendFormat": "node validation failures"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "reqps" }
          }
        },
        {
          "id": 10,
          "title": "E2E Schedule + Bind Estimate",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 32, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "eno:e2e_schedule_and_bind_duration:p90_estimate",
              "legendFormat": "P90 estimate"
            },
            {
              "expr": "eno:e2e_schedule_and_bind_duration:p99_estimate",
              "legendFormat": "P99 estimate"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "s" }
          }
        }
      ]
    }
