# Headless Services that expose /metrics endpoints of Volcano components.
#
# Group D: Volcano — scheduler + controller-manager
# The Volcano Helm chart creates its own services, but we create explicit
# headless services here for Prometheus service-discovery consistency.

# Volcano Scheduler metrics (default HTTP port: 8080)
apiVersion: v1
kind: Service
metadata:
  name: volcano-scheduler-metrics
  namespace: volcano-system
  labels:
    component: volcano-scheduler
spec:
  clusterIP: None
  selector:
    app: volcano-scheduler
  ports:
    - name: metrics
      port: 8080
      targetPort: 8080
      protocol: TCP
---
# Volcano Controller Manager metrics (default HTTP port: 8080)
apiVersion: v1
kind: Service
metadata:
  name: volcano-controller-metrics
  namespace: volcano-system
  labels:
    component: volcano-controller
spec:
  clusterIP: None
  selector:
    app: volcano-controller
  ports:
    - name: metrics
      port: 8080
      targetPort: 8080
      protocol: TCP
