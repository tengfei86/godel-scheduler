# ================================================================
# Prometheus config for Group B — Embedded Binder (Proposed)
#
# Scrape targets:
#   • eno-scheduler  (eno-system, port 10251, includes embedded binder metrics)
#   • eno-dispatcher (eno-system, port 10351)
#
# NOTE: The scheduler /metrics endpoint exposes BOTH scheduler metrics
# and embedded binder metrics (binder_embedded_*) when
# --enable-embedded-binder=true.
# ================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - "/etc/prometheus/rules.yml"

    scrape_configs:
      # ── Gödel Scheduler (includes embedded binder metrics) ──
      - job_name: "eno-scheduler"
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: ["eno-system"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: eno-scheduler-metrics
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: metrics
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_service_name]
            target_label: service

      # ── Gödel Dispatcher ──
      - job_name: "eno-dispatcher"
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: ["eno-system"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: eno-dispatcher-metrics
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: metrics
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

  # ================================================================
  # Recording rules for Group B — Embedded Binder
  # ================================================================
  rules.yml: |
    groups:
      # ──────────────────────────────────────────────────
      #  Embedded Binder — throughput & latency
      # ──────────────────────────────────────────────────
      - name: embedded_binder
        interval: 15s
        rules:
          # ── Throughput ──

          # Pod bind throughput (pods/s) over 1m window
          - record: eno:binder_embedded_bind_pods:rate1m
            expr: sum(rate(binder_embedded_bind_pods_total[1m]))

          # Unit bind throughput (units/s) over 1m window
          - record: eno:binder_embedded_bind_units:rate1m
            expr: sum(rate(binder_embedded_bind_total[1m]))

          # ── Latency — Unit level ──

          - record: eno:binder_embedded_bind_duration:p50
            expr: histogram_quantile(0.50, sum by (le) (rate(binder_embedded_bind_duration_seconds_bucket[1m])))

          - record: eno:binder_embedded_bind_duration:p90
            expr: histogram_quantile(0.90, sum by (le) (rate(binder_embedded_bind_duration_seconds_bucket[1m])))

          - record: eno:binder_embedded_bind_duration:p99
            expr: histogram_quantile(0.99, sum by (le) (rate(binder_embedded_bind_duration_seconds_bucket[1m])))

          - record: eno:binder_embedded_bind_duration:avg
            expr: >
              sum(rate(binder_embedded_bind_duration_seconds_sum[1m]))
              /
              sum(rate(binder_embedded_bind_duration_seconds_count[1m]))

          # ── Latency — Pod level ──

          - record: eno:binder_embedded_bind_pod_duration:p50
            expr: histogram_quantile(0.50, sum by (le) (rate(binder_embedded_bind_pod_duration_seconds_bucket[1m])))

          - record: eno:binder_embedded_bind_pod_duration:p90
            expr: histogram_quantile(0.90, sum by (le) (rate(binder_embedded_bind_pod_duration_seconds_bucket[1m])))

          - record: eno:binder_embedded_bind_pod_duration:p99
            expr: histogram_quantile(0.99, sum by (le) (rate(binder_embedded_bind_pod_duration_seconds_bucket[1m])))

          - record: eno:binder_embedded_bind_pod_duration:avg
            expr: >
              sum(rate(binder_embedded_bind_pod_duration_seconds_sum[1m]))
              /
              sum(rate(binder_embedded_bind_pod_duration_seconds_count[1m]))

          # ── Success rate ──

          - record: eno:binder_embedded_bind_pods:success_rate1m
            expr: >
              sum(rate(binder_embedded_bind_pods_total{result="success"}[1m]))
              /
              sum(rate(binder_embedded_bind_pods_total[1m]))

          - record: eno:binder_embedded_bind_units:success_rate1m
            expr: >
              sum(rate(binder_embedded_bind_total{result="success"}[1m]))
              /
              sum(rate(binder_embedded_bind_total[1m]))

          # ── Retries & fallback ──

          - record: eno:binder_embedded_bind_retries:rate1m
            expr: sum(rate(binder_embedded_bind_retries_total[1m]))

          - record: eno:binder_dispatcher_fallback:rate1m
            expr: sum(rate(binder_dispatcher_fallback_total[1m]))

          - record: eno:binder_node_validation_failures:rate1m
            expr: sum(rate(binder_node_validation_failures_total[1m]))

          # ── Concurrency ──
          # Query directly: binder_embedded_bind_inflight

      # ──────────────────────────────────────────────────
      #  Scheduler pipeline — throughput & latency
      # ──────────────────────────────────────────────────
      - name: scheduler_pipeline
        interval: 15s
        rules:
          - record: eno:scheduler_pod_scheduling_attempts:rate1m
            expr: sum(rate(scheduler_pod_scheduling_attempts[1m]))


          # ----- E2E scheduling latency -----
          - record: eno:scheduler_e2e_scheduling_duration:p50
            expr: histogram_quantile(0.50, sum by (le) (rate(scheduler_e2e_scheduling_duration_seconds_bucket[1m])))

          - record: eno:scheduler_e2e_scheduling_duration:p90
            expr: histogram_quantile(0.90, sum by (le) (rate(scheduler_e2e_scheduling_duration_seconds_bucket[1m])))

          - record: eno:scheduler_e2e_scheduling_duration:p99
            expr: histogram_quantile(0.99, sum by (le) (rate(scheduler_e2e_scheduling_duration_seconds_bucket[1m])))

          - record: eno:scheduler_e2e_scheduling_duration:avg
            expr: >
              sum(rate(scheduler_e2e_scheduling_duration_seconds_sum[1m]))
              /
              sum(rate(scheduler_e2e_scheduling_duration_seconds_count[1m]))

          # ----- Core algorithm latency -----
          - record: eno:scheduler_scheduling_algorithm_duration:p90
            expr: histogram_quantile(0.90, sum by (le) (rate(scheduler_scheduling_algorithm_duration_seconds_bucket[1m])))

          - record: eno:scheduler_scheduling_algorithm_duration:p99
            expr: histogram_quantile(0.99, sum by (le) (rate(scheduler_scheduling_algorithm_duration_seconds_bucket[1m])))

      # ──────────────────────────────────────────────────
      #  E2E pipeline (schedule + bind combined)
      # ──────────────────────────────────────────────────
      - name: e2e_pipeline
        interval: 15s
        rules:
          # Eno pod E2E latency (dispatcher → scheduler → binder → done)
          - record: eno:pod_e2e_duration:p50
            expr: histogram_quantile(0.50, sum by (le) (rate(eno_pod_e2e_duration_seconds_bucket[1m])))

          - record: eno:pod_e2e_duration:p90
            expr: histogram_quantile(0.90, sum by (le) (rate(eno_pod_e2e_duration_seconds_bucket[1m])))

          - record: eno:pod_e2e_duration:p99
            expr: histogram_quantile(0.99, sum by (le) (rate(eno_pod_e2e_duration_seconds_bucket[1m])))

          # Combined schedule + bind P90 estimate
          - record: eno:e2e_schedule_and_bind_duration:p90_estimate
            expr: >
              eno:scheduler_e2e_scheduling_duration:p90
              +
              eno:binder_embedded_bind_duration:p90

          - record: eno:e2e_schedule_and_bind_duration:p99_estimate
            expr: >
              eno:scheduler_e2e_scheduling_duration:p99
              +
              eno:binder_embedded_bind_duration:p99
