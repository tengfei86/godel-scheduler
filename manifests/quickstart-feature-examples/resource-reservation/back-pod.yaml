apiVersion: v1
kind: Pod
metadata:
  name: back-pod
  labels:
    app: back-pod
  annotations:
    eno.io/pod-resource-type: guaranteed
    eno.io/pod-launcher: kubelet
    eno.io/reservation-index: "reservation-pod"
spec:
  schedulerName: eno-scheduler
  containers:
    - name: back-pod
      image: nginx
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          cpu: "1"
          memory: "100Mi"
  restartPolicy: Always