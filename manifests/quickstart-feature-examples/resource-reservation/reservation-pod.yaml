apiVersion: v1
kind: Pod
metadata:
  name: res-pod
  labels:
    app: res-pod
  annotations:
    eno.io/pod-resource-type: guaranteed
    eno.io/pod-launcher: kubelet
    eno.io/reservation: "true"                         # reservation requirement
    eno.io/reservation-index: "reservation-pod"        # identifier for back pod
spec:
  schedulerName: eno-scheduler
  containers:
    - name: res-pod
      image: nginx
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          cpu: "1"
          memory: "100Mi"
  restartPolicy: Always
