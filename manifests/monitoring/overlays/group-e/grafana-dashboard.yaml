---
# Grafana dashboard provisioning — 告知 Grafana 从哪里加载 dashboard JSON
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provisioning
  namespace: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: scheduler-dashboards
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /etc/grafana/dashboards
---
# Grafana dashboard JSON — Group E: Koordinator (Alibaba hybrid scheduler)
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  koordinator-scheduler.json: |
    {
      "title": "Group E — Koordinator Scheduler (Alibaba Hybrid)",
      "uid": "koordinator-scheduler",
      "timezone": "browser",
      "refresh": "15s",
      "time": { "from": "now-30m", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Scheduling Throughput (pods/s) by Result",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "koord:scheduler_schedule_attempts:rate1m",
              "legendFormat": "{{result}}"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "reqps" }
          }
        },
        {
          "id": 2,
          "title": "Successful Scheduling Throughput (pods/s)",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "koord:scheduler_schedule_attempts_scheduled:rate1m",
              "legendFormat": "scheduled"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "reqps" }
          }
        },
        {
          "id": 3,
          "title": "E2E Scheduling Latency",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "koord:scheduler_e2e_scheduling_duration:p50",
              "legendFormat": "P50"
            },
            {
              "expr": "koord:scheduler_e2e_scheduling_duration:p90",
              "legendFormat": "P90"
            },
            {
              "expr": "koord:scheduler_e2e_scheduling_duration:p99",
              "legendFormat": "P99"
            },
            {
              "expr": "koord:scheduler_e2e_scheduling_duration:avg",
              "legendFormat": "avg"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "s" }
          }
        },
        {
          "id": 4,
          "title": "Scheduling Attempt Latency (Core Algorithm)",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "koord:scheduler_scheduling_attempt_duration:p90",
              "legendFormat": "P90"
            },
            {
              "expr": "koord:scheduler_scheduling_attempt_duration:p99",
              "legendFormat": "P99"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "s" }
          }
        },
        {
          "id": 5,
          "title": "Binding Duration",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 16, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "koord:scheduler_binding_duration:p90",
              "legendFormat": "P90"
            },
            {
              "expr": "koord:scheduler_binding_duration:p99",
              "legendFormat": "P99"
            },
            {
              "expr": "koord:scheduler_binding_duration:avg",
              "legendFormat": "avg"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "s" }
          }
        },
        {
          "id": 6,
          "title": "Framework Extension Point Latency P90",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 16, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "koord:scheduler_framework_extension_point_duration:p90",
              "legendFormat": "P90 {{extension_point}}"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "s" }
          }
        },
        {
          "id": 7,
          "title": "Plugin Execution Latency P90",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 24, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "koord:scheduler_plugin_execution_duration:p90",
              "legendFormat": "P90 {{plugin}}"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "s" }
          }
        },
        {
          "id": 8,
          "title": "Scheduling Success Rate",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 24, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "koord:scheduler_schedule_attempts:success_rate5m",
              "legendFormat": "success rate"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "percentunit", "min": 0, "max": 1 }
          }
        },
        {
          "id": 9,
          "title": "Scheduling Error Rate",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 32, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "koord:scheduler_schedule_attempts:error_rate5m",
              "legendFormat": "error rate"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "percentunit", "min": 0, "max": 1 }
          }
        },
        {
          "id": 10,
          "title": "Peak Scheduling Throughput (30m)",
          "type": "stat",
          "gridPos": { "x": 12, "y": 32, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "koord:scheduler_peak_throughput:30m",
              "legendFormat": "peak throughput"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "reqps" }
          }
        }
      ]
    }
