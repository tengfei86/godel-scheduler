# ================================================================
# Prometheus config for Group E — Koordinator (Alibaba hybrid scheduler)
#
# Scrape targets:
#   • koord-scheduler (koordinator-system, HTTP port 10251)
#   • koord-manager   (koordinator-system, HTTP port 9316)
#
# Koordinator extends the kube-scheduler framework, so it exposes the
# standard "scheduler_*" metrics plus Koordinator-specific "koordinator_*"
# metrics. Key metrics:
#   scheduler_schedule_attempts_total{result}
#   scheduler_e2e_scheduling_duration_seconds
#   scheduler_scheduling_attempt_duration_seconds
#   scheduler_binding_duration_seconds
#   scheduler_framework_extension_point_duration_seconds
#   scheduler_plugin_execution_duration_seconds
#   koordinator_scheduling_*  (QoS-aware extensions)
# ================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - "/etc/prometheus/rules.yml"

    scrape_configs:
      # ── Koordinator Scheduler ──
      - job_name: "koord-scheduler"
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: ["koordinator-system"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: koord-scheduler-metrics
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: metrics
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_service_name]
            target_label: service

      # ── Koordinator Manager ──
      - job_name: "koord-manager"
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: ["koordinator-system"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: koord-manager-metrics
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: metrics
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

  # ================================================================
  # Recording rules for Group E — Koordinator
  #
  # Since Koordinator extends kube-scheduler framework, it exposes
  # the same "scheduler_*" metric names as kube-scheduler, plus
  # custom "koordinator_*" metrics. We use the "koord:" prefix for
  # recording rules to distinguish from Group C.
  # ================================================================
  rules.yml: |
    groups:
      # ──────────────────────────────────────────────────
      #  Throughput
      # ──────────────────────────────────────────────────
      - name: koord_throughput
        interval: 15s
        rules:
          # Scheduling throughput (pods/s) by result
          - record: koord:scheduler_schedule_attempts:rate1m
            expr: rate(scheduler_schedule_attempts_total[1m])

          - record: koord:scheduler_schedule_attempts:rate5m
            expr: rate(scheduler_schedule_attempts_total[5m])

          # Successful scheduling throughput
          - record: koord:scheduler_schedule_attempts_scheduled:rate1m
            expr: rate(scheduler_schedule_attempts_total{result="scheduled"}[1m])

          # Peak throughput
          - record: koord:scheduler_peak_throughput:30m
            expr: max_over_time(sum(rate(scheduler_schedule_attempts_total{result="scheduled"}[1m]))[30m:])

      # ──────────────────────────────────────────────────
      #  Latency
      # ──────────────────────────────────────────────────
      - name: koord_latency
        interval: 15s
        rules:
          # E2E scheduling latency
          - record: koord:scheduler_e2e_scheduling_duration:p50
            expr: histogram_quantile(0.50, rate(scheduler_e2e_scheduling_duration_seconds_bucket[5m]))

          - record: koord:scheduler_e2e_scheduling_duration:p90
            expr: histogram_quantile(0.90, rate(scheduler_e2e_scheduling_duration_seconds_bucket[5m]))

          - record: koord:scheduler_e2e_scheduling_duration:p99
            expr: histogram_quantile(0.99, rate(scheduler_e2e_scheduling_duration_seconds_bucket[5m]))

          - record: koord:scheduler_e2e_scheduling_duration:avg
            expr: >
              rate(scheduler_e2e_scheduling_duration_seconds_sum[5m])
              /
              rate(scheduler_e2e_scheduling_duration_seconds_count[5m])

          # Scheduling attempt latency (core algorithm)
          - record: koord:scheduler_scheduling_attempt_duration:p90
            expr: histogram_quantile(0.90, rate(scheduler_scheduling_attempt_duration_seconds_bucket[5m]))

          - record: koord:scheduler_scheduling_attempt_duration:p99
            expr: histogram_quantile(0.99, rate(scheduler_scheduling_attempt_duration_seconds_bucket[5m]))

          # Binding duration
          - record: koord:scheduler_binding_duration:p90
            expr: histogram_quantile(0.90, rate(scheduler_binding_duration_seconds_bucket[5m]))

          - record: koord:scheduler_binding_duration:p99
            expr: histogram_quantile(0.99, rate(scheduler_binding_duration_seconds_bucket[5m]))

          - record: koord:scheduler_binding_duration:avg
            expr: >
              rate(scheduler_binding_duration_seconds_sum[5m])
              /
              rate(scheduler_binding_duration_seconds_count[5m])

          # Framework extension point latency
          - record: koord:scheduler_framework_extension_point_duration:p90
            expr: histogram_quantile(0.90, rate(scheduler_framework_extension_point_duration_seconds_bucket[5m]))

          # Plugin execution latency
          - record: koord:scheduler_plugin_execution_duration:p90
            expr: histogram_quantile(0.90, rate(scheduler_plugin_execution_duration_seconds_bucket[5m]))

      # ──────────────────────────────────────────────────
      #  Success rate
      # ──────────────────────────────────────────────────
      - name: koord_success
        interval: 15s
        rules:
          - record: koord:scheduler_schedule_attempts:success_rate5m
            expr: >
              sum(rate(scheduler_schedule_attempts_total{result="scheduled"}[5m]))
              /
              sum(rate(scheduler_schedule_attempts_total[5m]))

          - record: koord:scheduler_schedule_attempts:error_rate5m
            expr: >
              sum(rate(scheduler_schedule_attempts_total{result="error"}[5m]))
              /
              sum(rate(scheduler_schedule_attempts_total[5m]))
