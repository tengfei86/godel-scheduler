# Headless Services that expose /metrics endpoints of Gödel components.
# These are used by Prometheus service-discovery (endpoints role) to find
# scrape targets automatically.
#
# Group A: Gödel Scheduler (Baseline) — scheduler + dispatcher + standalone binder

# Scheduler metrics (default insecure port: 10251)
apiVersion: v1
kind: Service
metadata:
  name: godel-scheduler-metrics
  namespace: godel-system
  labels:
    component: scheduler
spec:
  clusterIP: None
  selector:
    app: godel-scheduler
  ports:
    - name: metrics
      port: 10251
      targetPort: 10251
      protocol: TCP
---
# Dispatcher metrics (default insecure port: 10351)
apiVersion: v1
kind: Service
metadata:
  name: godel-dispatcher-metrics
  namespace: godel-system
  labels:
    component: dispatcher
spec:
  clusterIP: None
  selector:
    app: godel-dispatcher
  ports:
    - name: metrics
      port: 10351
      targetPort: 10351
      protocol: TCP
---
# Standalone Binder metrics (default insecure port: 10451)
apiVersion: v1
kind: Service
metadata:
  name: godel-binder-metrics
  namespace: godel-system
  labels:
    component: binder
spec:
  clusterIP: None
  selector:
    app: binder
  ports:
    - name: metrics
      port: 10451
      targetPort: 10451
      protocol: TCP
